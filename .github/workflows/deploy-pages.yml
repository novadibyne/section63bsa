name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --if-present
      # base_path is "" once the custom domain (legalhashed.com) is set in Settings → Pages,
      # and "/<repo-name>" while the site is served from novadibyne.github.io/<repo-name>/.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Usage statistics go to the telemetry worker in lib/config.ts. To use another worker, or "off" to switch
          # them off, set the repository variable TELEMETRY_URL (Settings → Secrets and variables → Actions → Variables).
          NEXT_PUBLIC_TELEMETRY_URL: ${{ vars.TELEMETRY_URL }}
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          # Search engine ownership checks (README → Search engines). Empty means none.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
